schemaVersion: 3
tool: nlissn
runId: workspace-generator-cli-20260804
input:
  path: WorkspaceFixture.sln
  targetFramework: net10.0
  configuration: Debug
  platform: AnyCPU
  restore: disabled
  generatedSources: include
  generators: enabled
analysis: {}
execution:
  writeBack: false
  skipRewrite: true
  directoryMaxDegreeOfParallelism: 1
  cpgMaxDegreeOfParallelism: 1
  groupMaxDegreeOfParallelism: 1
  helperMaxDegreeOfParallelism: 1
  replayMaxDegreeOfParallelism: 1
  maxConcurrentOperations: 1
artifacts:
  # 不声明 root：留空即由加载器默认到仓库根 Build/Result，产物不再落在夹具目录里的 artifacts/。
  # artifacts.root 只接受不含 '..' 的仓库内相对路径，所以这里无法直接写 ../../../../Build。
  diff:
    enabled: false
  runtimeLog:
    enabled: false
  evidence:
    enabled: false
  rewritePlan:
    mode: none
  analysisLog:
    enabled: false
