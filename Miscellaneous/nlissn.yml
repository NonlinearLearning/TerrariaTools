schemaVersion: 3
tool: nlissn
runId: library-entry-smoke
input:
  path: ../tests/NLISSN.Testing/TestCodeSet/Workspace/Library/Library.cs
analysis:
  targetName: LibraryEntry
  deleteClass: LibraryEntry
  disabledRuleTypes: []
  validateBindings: false
  deleteUnreachableMethods: false
  deleteUnreferencedMethods: false
  clearUnusedInterfaceImplementations: false
  privatizeInternalOnlyPublicMethods: false
execution:
  writeBack: false
  skipRewrite: true
  directoryMaxDegreeOfParallelism: 1
  cpgMaxDegreeOfParallelism: 1
  groupMaxDegreeOfParallelism: 1
  helperMaxDegreeOfParallelism: 1
  replayMaxDegreeOfParallelism: 1
  maxConcurrentOperations: 1
  directoryParallelism: true
  groupParallelism: false
  helperParallelism: true
  fastDeleteClassDirectory: false
  filterDeleteClassFilesByTargetName: false
artifacts:
  root: tmp
  diff: { enabled: false, view: readable }
  runtimeLog: { enabled: true }
  evidence: { enabled: true }
  rewritePlan: { mode: none }
  analysisLog: { enabled: false }
logging:
  profile: normal
  level: info
  categories: []
  events: []
  view: normal
